<!DOCTYPE html>
<html>
<head>
    <title>Team Registration</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>

    <nav>
        <a href="Team Finder.html">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <div class="hero">
        <h1>Join a Team</h1>
        <p>Fill in your details below</p>
    </div>

    <form action="success.html" method="get">
        <label>Name:</label>
        <input type="text" name="username" required>
        <br>

        <label>Email:</label>
        <input type="email" name="email" required>
        <br>

        <label>Contact Number:</label>
        <input type="text" name="phone" required>
        <br>

        <label>Your Skills:</label>
        <input type="text" name="skills" placeholder="e.g. Python, UI Design" required>
        <br>

        <label>Your Photo:</label>
        <input type="file" name="photo" accept="image/*">
        <br>

        <label>Additional Details:</label>
        <input type="text" name="details" placeholder="Why you'd be a good fit">
        <br>

        <button type="submit">Request to Join</button>
    </form>

    <footer>
        <p>&copy; 2026 Project Team Finder. Built for our WebX lab project.</p>
    </footer>

</body>
</html>
